services:
  portfolio:
    image: nginx:1.29-alpine
    container_name: portfolio
    restart: unless-stopped
    ports:
      # Nginx Proxy Manager lives in its own stack and already owns 80/443, so
      # this publishes a plain-HTTP port for it to proxy to. Nothing else on
      # the box should be on 8082 - 80/443/81 are NPM, 2283 is Immich and
      # 8008-8010 are the Matrix bridges.
      - '8082:80'
    environment:
      TZ: Europe/Athens
    healthcheck:
      # Safe to probe here, unlike the old Caddy image: TLS and the :80
      # redirect are NPM's job, so localhost really does serve the site.
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://localhost/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      # The built site, rsynced from the workstation by deploy/deploy.sh.
      # Read-only: nginx never writes here, and a typo in a path should fail
      # rather than quietly create a directory.
      - /home/debian/docker/appdata/portfolio/site:/usr/share/nginx/html:ro
      - /home/debian/docker/appdata/portfolio/nginx.conf:/etc/nginx/conf.d/default.conf:ro
