# Build the portfolio image and publish it to the GitHub Container Registry.
#
# Every push to main is a release: `git push`, wait a few minutes (the
# repository's Actions tab shows progress), then pull on the server. Each build
# is published twice:
#
#   ghcr.io/kazoulidis/gis-portfolio:latest               what the server runs
#   ghcr.io/kazoulidis/gis-portfolio:2026-11-04-cf63338   date (Athens) and commit,
#                                                          kept for rolling back
#
# A push that only touches the README builds nothing. A build can also be
# started by hand from the Actions tab.
#
# Only for arm64, the Oracle Ampere box it runs on. The final stage of the
# Dockerfile only copies files, so no emulation (QEMU) is needed.

name: Release image

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The workflow's own token can publish to this repository's packages, so
      # there is no password or personal token to store.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kazoulidis/gis-portfolio
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix={{date 'YYYY-MM-DD' tz='Europe/Athens'}}-

      # Timestamps are rewritten so that a layer whose files did not change comes
      # out byte for byte the same, and the server does not fetch it again.
      - uses: docker/build-push-action@v6
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
