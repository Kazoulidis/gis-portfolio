# Mounted at /etc/nginx/conf.d/default.conf in the `portfolio` container.
#
# This server only ever sees plain HTTP from Nginx Proxy Manager on the host.
# TLS, HTTP/2 and the redirect from :80 are all NPM's job, so there is no ssl_
# directive here, no certificate, and nothing to renew.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # NPM is the only client, so the peer address is always a Docker bridge
    # address and every log line would otherwise read as the proxy rather than
    # the visitor. 172.16.0.0/12 covers the default bridge and every
    # user-defined one Compose creates.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # When nginx redirects a directory request it builds an absolute URL from
    # the Host and its own listening port - which behind a proxy leaks
    # "http://host:80/...". Relative redirects avoid that entirely.
    absolute_redirect off;

    # Security headers live only at this level on purpose. nginx replaces the
    # whole inherited add_header set the moment a location declares one of its
    # own, so the cache rules below use `expires`, which is a separate
    # directive and leaves these in place.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Astro is configured with build.format: 'file', so /projects/foo lives on
    # disk as /projects/foo.html. This is what makes the extensionless URL
    # resolve.
    location / {
        try_files $uri $uri.html $uri/ =404;

        # Short, because it is what makes the link prefetching pay off: without
        # it the browser still spends a round trip revalidating a page it has
        # already fetched, and the click is merely fast rather than instant.
        # Longer than a visitor's session, shorter than you will notice when
        # publishing.
        expires 5m;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Astro fingerprints these filenames, so they can never go stale.
    location /_astro/ {
        expires 1y;
    }

    # Maps, data and downloads keep stable names, so cache them - but not
    # forever, or a corrected map never reaches anyone who has already seen the
    # old one.
    #
    # GeoJSON first, because nginx's built-in mime.types has no entry for it:
    # it would go out as application/octet-stream, which gzip_types does not
    # list, so every layer would ship uncompressed (4.4 MB instead of ~0.5 MB
    # for the fire map). A `types` block here would replace the whole inherited
    # table, hence the empty one plus default_type, scoped to this location.
    location ~* \.geojson$ {
        types { }
        default_type application/geo+json;
        expires 7d;
    }

    location ~* \.(json|png|jpe?g|webp|svg|pdf|zip)$ {
        expires 7d;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Not the default `off`. NPM adds a Via header, and `gzip_proxied off`
    # takes that as a reason to serve every response uncompressed - which on
    # the larger GeoJSON layers is the difference between 0.7 MB and 25 MB.
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/geo+json image/svg+xml;

    # Already-compressed formats are absent from that list on purpose: webp,
    # png, pdf and the zip gain nothing and cost CPU, which is the scarce
    # resource on a 2-OCPU box.

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
