# /etc/nginx/sites-available/portfolio
#
# Serves the static build in /var/www/portfolio.
# Get the TLS certificate with:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d example.com -d www.example.com
# Certbot rewrites the :80 block below to redirect to HTTPS and fills in the
# certificate paths itself, so install this file first, then run it.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/portfolio;
    index index.html;

    # Astro is configured with build.format: 'file', so /projects/foo is on
    # disk as /projects/foo.html. This makes the extensionless URL work.
    location / {
        try_files $uri $uri.html $uri/ =404;

        # Pages. This short lifetime is what makes the link prefetching pay
        # off: without it the browser still spends a round trip revalidating a
        # page it already fetched, and the click is merely fast rather than
        # instant. Five minutes is longer than a visitor's session and shorter
        # than you will notice when publishing.
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    error_page 404 /404.html;

    # Hashed asset filenames — safe to cache hard. A prefix location this
    # specific wins over `location /` above, so these do not inherit its
    # five-minute lifetime.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Your data and images keep stable names, so cache them briefly instead.
    location ~* \.(geojson|json|png|jpe?g|webp|svg|pdf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/geo+json image/svg+xml;

    # GeoJSON compresses extremely well — worth it on larger layers.
    # For files over a few MB, consider pre-compressing at build time with the
    # ngx_brotli module instead.

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/portfolio.access.log;
    error_log  /var/log/nginx/portfolio.error.log;
}
